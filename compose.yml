services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - sqlite_data:/data
    expose:
      - "8000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8088}:80"
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.erp-citrat.rule=Host(`erp-citrat.158-69-201-110.sslip.io`)"
      - "traefik.http.routers.erp-citrat.entrypoints=websecure"
      - "traefik.http.routers.erp-citrat.tls=true"
      - "traefik.http.routers.erp-citrat.tls.certresolver=letsencrypt"
      - "traefik.http.routers.erp-citrat.service=erp-citrat"
      - "traefik.http.services.erp-citrat.loadbalancer.server.port=80"

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: proxy

volumes:
  sqlite_data:
